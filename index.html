/* ===== Update 1.04 ===== */
.main{position:relative}

#srow{gap:8px}

.it{display:flex;gap:10px;align-items:flex-start;padding:10px 12px 10px 8px}

// ===== phone back gesture: close layers one by one before leaving the app =====
(()=>{let pushed=0,skip=0,qd=0;
const layers=()=>{const a=[];if(innerWidth<820&&$('#app').classList.contains('open'))a.push('note');if($('#bot').classList.contains('open'))a.push('tags');if($('#mm').classList.contains('show'))a.push('menu');if($('#dw').classList.contains('on'))a.push('drawer');if(!$('#sh').hidden)a.push('sheet');return a};
const closeTop=()=>{const t=layers().pop();if(t=='sheet'){$('#sh').hidden=true;apply()}else if(t=='drawer')$('#dw').classList.remove('on');else if(t=='menu'){$('#mm').classList.remove('show');$('#xm').classList.remove('open');$('#xb').classList.remove('open')}else if(t=='tags')$('#bot').classList.remove('open');else if(t=='note')closeNote()};
const sync=()=>{qd=0;const w=layers().length;if(w>pushed){while(pushed<w)history.pushState({sn:++pushed},'')}else if(w<pushed){const d=pushed-w;pushed=w;skip++;history.go(-d)}};
const q=()=>{if(!qd){qd=1;queueMicrotask(sync)}};
addEventListener('popstate',()=>{if(skip){skip--;return}if(pushed>0){pushed--;closeTop();setTimeout(sync,260)}});
const mo=new MutationObserver(q);['#app','#dw','#mm','#bot','#sh'].forEach(i=>mo.observe($(i),{attributes:true,attributeFilter:['class','hidden']}));
addEventListener('resize',q);
if(history.state&&history.state.sn){skip++;history.go(-history.state.sn)}})();
})();</script></body></html>
